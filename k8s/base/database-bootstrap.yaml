apiVersion: batch/v1
kind: Job
metadata:
  name: tech-challenge-database-bootstrap
  namespace: tech-challenge
  labels:
    app.kubernetes.io/name: tech-challenge-database-bootstrap
    app.kubernetes.io/component: database-bootstrap
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tech-challenge-database-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: postgres-bootstrap
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: tech-challenge-api-secret
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until pg_isready "$DATABASE_URL"; do
                echo "Aguardando PostgreSQL..."
                sleep 5
              done
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
              SELECT format('CREATE DATABASE %I', 'os_service')
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'os_service')\gexec
              SELECT format('CREATE DATABASE %I', 'billing_service')
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'billing_service')\gexec
              SQL
