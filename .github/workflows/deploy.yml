name: Deploy

on:
  push:
    branches:
      - homolog
      - main

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  K8S_NAMESPACE: tech-challenge
  K8S_DEPLOYMENT: tech-challenge-api
  DOCKER_IMAGE: docker.io/gustavodetoni/tech-challenge-project
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  deploy:
    name: Deploy Kubernetes Infra
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform -chdir=terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=tech-challenge/k8s/${{ github.ref_name }}.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform validate
        run: terraform -chdir=terraform validate

      - name: Terraform plan
        env:
          TF_VAR_environment: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
          TF_VAR_api_gateway_integration_uri: ${{ vars.API_GATEWAY_INTEGRATION_URI }}
          TF_VAR_auth_lambda_invoke_arn: ${{ vars.AUTH_LAMBDA_INVOKE_ARN }}
          TF_VAR_auth_lambda_function_name: ${{ vars.AUTH_LAMBDA_FUNCTION_NAME }}
        run: terraform -chdir=terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform -chdir=terraform apply -auto-approve tfplan

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Update kubeconfig
        run: |
          cluster_name="$(terraform -chdir=terraform output -raw cluster_name)"
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$cluster_name"

      - name: Create Kubernetes env file
        env:
          OVERLAY: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
        run: |
          {
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}"
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
            echo "BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}"
            echo "BREVO_SENDER_EMAIL=${{ secrets.BREVO_SENDER_EMAIL }}"
          } > "k8s/overlays/$OVERLAY/.env.k8s"

      - name: Deploy Kubernetes manifests
        env:
          OVERLAY: ${{ github.ref_name == 'main' && 'prod' || 'homolog' }}
        run: kubectl apply -k "k8s/overlays/$OVERLAY"

      - name: Wait for rollout
        run: kubectl rollout status "deployment/$K8S_DEPLOYMENT" -n "$K8S_NAMESPACE" --timeout=300s

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Deploy Datadog Agent
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
        run: |
          if [ -z "$DATADOG_API_KEY" ]; then
            echo "DATADOG_API_KEY not configured. Skipping Datadog Agent deploy."
            exit 0
          fi
          kubectl create namespace datadog --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic datadog-secret \
            --namespace datadog \
            --from-literal=api-key="$DATADOG_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -
          helm repo add datadog https://helm.datadoghq.com
          helm repo update
          helm upgrade --install datadog-agent datadog/datadog \
            --namespace datadog \
            --values observability/datadog-values.yaml
